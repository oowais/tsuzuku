openapi: 3.1.1
info:
  title: Tsuzuku API
  version: "1"
servers:
  - url: /
paths:
  /api/anilist/search:
    get:
      operationId: getAnilistSearch
      tags:
        - anilist
      description: Anime by title on AniList, to pick the entry for a show nothing links yet (#66). Real results only.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StartTarget"
        default:
          $ref: "#/components/responses/Error"
  /api/anime/add/confirm:
    post:
      operationId: postAnimeAddConfirm
      tags:
        - anime
      description: "Adds an anime you picked on Shows to MAL and Simkl, onto Watching or Plan to Watch: reads the lists and MAL's list status again, writes only the steps that still match the preview, and logs each write. No link is made: the season mapping is proposed through the normal flow once Trakt shows the show."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                malId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                status:
                  type: string
                  enum:
                    - watching
                    - plan_to_watch
                steps:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        enum:
                          - simkl
                          - mal
                      expected:
                        type: string
                    required:
                      - source
                      - expected
              required:
                - malId
                - status
                - steps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum:
                            - simkl
                            - mal
                        ok:
                          type: boolean
                        error:
                          type: string
                      required:
                        - source
                        - ok
                      additionalProperties: false
                required:
                  - outcomes
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/anime/add/preview:
    post:
      operationId: postAnimeAddPreview
      tags:
        - anime
      description: "What adding an anime you picked on Shows would do, per source: MAL and Simkl, onto Watching or Plan to Watch. Writes nothing. Reads MAL's list status for the entry, so an entry already on your MAL list is never moved; the confirm reads it again."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                malId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                status:
                  type: string
                  enum:
                    - watching
                    - plan_to_watch
              required:
                - malId
                - status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartPlan"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/{source}/callback:
    get:
      operationId: getAuthSourceCallback
      tags:
        - auth
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/auth/{source}/start:
    get:
      operationId: getAuthSourceStart
      tags:
        - auth
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/backups/{name}:
    get:
      operationId: getBackupsName
      tags:
        - backups
      description: Downloads one backup. Only a name in the current list is served; anything else is a 404.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The backup file
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                contentMediaType: application/vnd.sqlite3
        default:
          $ref: "#/components/responses/Error"
  /api/backups:
    get:
      operationId: getBackups
      tags:
        - backups
      description: The backups in the backups folder, newest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupFile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: postBackups
      tags:
        - backups
      description: '"Back up now" in Settings.'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFile"
        default:
          $ref: "#/components/responses/Error"
  /api/calendar:
    get:
      operationId: getCalendar
      tags:
        - calendar
      description: The calendar for a range, one month in your own time zone (#72). Up Next as last read, so opening the calendar does not read the three lists again.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range (inclusive), any date the server can parse; the app sends an ISO 8601 instant.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: End of the range, after `from` and at most 32 days later.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarItem"
                  sources:
                    type: object
                    properties:
                      trakt:
                        type: object
                        properties:
                          status:
                            type: string
                          stale:
                            type: boolean
                          error:
                            anyOf:
                              - type: "null"
                              - type: string
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                        required:
                          - status
                          - stale
                          - error
                          - retryAfter
                        additionalProperties: false
                      anilist:
                        type: object
                        properties:
                          status:
                            type: string
                          stale:
                            type: boolean
                          error:
                            anyOf:
                              - type: "null"
                              - type: string
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                        required:
                          - status
                          - stale
                          - error
                          - retryAfter
                        additionalProperties: false
                    required:
                      - trakt
                      - anilist
                    additionalProperties: false
                required:
                  - items
                  - sources
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/coming-back:
    get:
      operationId: getComingBack
      tags:
        - coming-back
      description: "The sequels of anime you completed that are on no watching list (#66). Read when the section is opened, never with the Up Next page: it reads your MAL list and AniList, each cached (MAL for a day, AniList by sequel stage)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComingBackResult"
        default:
          $ref: "#/components/responses/Error"
  /api/coming-back/dismiss:
    post:
      operationId: postComingBackDismiss
      tags:
        - coming-back
      description: Keep a sequel out of Coming back until undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                malId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
              required:
                - malId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/coming-back/undo-dismiss:
    post:
      operationId: postComingBackUndoDismiss
      tags:
        - coming-back
      description: Bring a dismissed sequel back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                malId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
              required:
                - malId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - health
      description: "For the container health check: the server answers and the database opens (migrations applied). Calls no source, and needs no Cloudflare Access token. `apiVersion` is this spec's `info.version`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  apiVersion:
                    type: integer
                required:
                  - ok
                  - apiVersion
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mapping/preview:
    get:
      operationId: getMappingPreview
      tags:
        - mapping
      description: "Step 4, first layer: every watching-list entry in one shape, the groups that share a real ID, and the AniList entry for every MAL ID seen. Read-only; nothing is stored except caches."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: object
                    properties:
                      trakt:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          fetchedAt:
                            anyOf:
                              - type: "null"
                              - type: string
                                format: date-time
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - fetchedAt
                          - retryAfter
                        additionalProperties: false
                      simkl:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          fetchedAt:
                            anyOf:
                              - type: "null"
                              - type: string
                                format: date-time
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - fetchedAt
                          - retryAfter
                        additionalProperties: false
                      mal:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          fetchedAt:
                            anyOf:
                              - type: "null"
                              - type: string
                                format: date-time
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - fetchedAt
                          - retryAfter
                        additionalProperties: false
                    required:
                      - trakt
                      - simkl
                      - mal
                    additionalProperties: false
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum:
                            - trakt
                            - simkl
                            - mal
                        error:
                          type: string
                      required:
                        - source
                        - error
                      additionalProperties: false
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkGroup"
                  anilist:
                    $ref: "#/components/schemas/AniListLookup"
                required:
                  - sources
                  - entries
                  - errors
                  - groups
                  - anilist
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mappings/confirm:
    post:
      operationId: postMappingsConfirm
      tags:
        - mappings
      description: Places an anime entry in a Trakt season. The anime entry must be on your current lists and the Trakt show must be on your up-next list or confirmed by Trakt, so only real IDs are ever stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                traktId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                animeKey:
                  type: string
                traktSeason:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                episodeOffset:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - traktId
                - animeKey
                - traktSeason
                - episodeOffset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mappings/edit:
    post:
      operationId: postMappingsEdit
      tags:
        - mappings
      description: Changes where a linked anime entry sits in its Trakt show (local database only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seasonId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                traktSeason:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                episodeOffset:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - seasonId
                - traktSeason
                - episodeOffset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mappings:
    get:
      operationId: getMappings
      tags:
        - mappings
      description: "Mapping page data: your list entries, stored links, and proposals waiting for your confirm. Stores ID-proven links as a side effect (local database only)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: object
                    properties:
                      trakt:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - retryAfter
                        additionalProperties: false
                      simkl:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - retryAfter
                        additionalProperties: false
                      mal:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - error
                              - rate_limited
                              - ok
                              - auth_expired
                          stale:
                            type: boolean
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - stale
                          - retryAfter
                        additionalProperties: false
                      anilist:
                        type: object
                        properties:
                          status:
                            type: string
                          retryAfter:
                            anyOf:
                              - type: "null"
                              - type: number
                          error:
                            type: string
                        required:
                          - status
                          - retryAfter
                        additionalProperties: false
                      traktLookups:
                        type: object
                        properties:
                          blocked:
                            type: boolean
                        required:
                          - blocked
                        additionalProperties: false
                    required:
                      - trakt
                      - simkl
                      - mal
                      - anilist
                      - traktLookups
                    additionalProperties: false
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum:
                            - trakt
                            - simkl
                            - mal
                        error:
                          type: string
                      required:
                        - source
                        - error
                      additionalProperties: false
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                  mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        seasons:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: number
                              userId:
                                type: number
                              mappingId:
                                type: number
                              traktSeason:
                                anyOf:
                                  - type: "null"
                                  - type: number
                              malId:
                                anyOf:
                                  - type: "null"
                                  - type: number
                              anilistId:
                                anyOf:
                                  - type: "null"
                                  - type: number
                              simklId:
                                anyOf:
                                  - type: "null"
                                  - type: number
                              episodeOffset:
                                type: number
                              episodeCount:
                                anyOf:
                                  - type: "null"
                                  - type: number
                              createdAt:
                                type: string
                                format: date-time
                              updatedAt:
                                type: string
                                format: date-time
                            required:
                              - id
                              - userId
                              - mappingId
                              - traktSeason
                              - malId
                              - anilistId
                              - simklId
                              - episodeOffset
                              - episodeCount
                              - createdAt
                              - updatedAt
                            additionalProperties: false
                        id:
                          type: number
                        userId:
                          type: number
                        traktId:
                          anyOf:
                            - type: "null"
                            - type: number
                        traktSlug:
                          anyOf:
                            - type: "null"
                            - type: string
                          description: For links to trakt.tv; Trakt URLs use the slug.
                        simklId:
                          anyOf:
                            - type: "null"
                            - type: number
                        malId:
                          anyOf:
                            - type: "null"
                            - type: number
                        tmdbId:
                          anyOf:
                            - type: "null"
                            - type: number
                        anilistId:
                          anyOf:
                            - type: "null"
                            - type: number
                        kind:
                          type: string
                          enum:
                            - anime
                            - show
                        status:
                          type: string
                          enum:
                            - auto
                            - confirmed
                            - rejected
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                        - seasons
                        - id
                        - userId
                        - traktId
                        - traktSlug
                        - simklId
                        - malId
                        - tmdbId
                        - anilistId
                        - kind
                        - status
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  traktTitles:
                    type: object
                    additionalProperties:
                      type: string
                  chains:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          malId:
                            type: number
                          title:
                            type: string
                          format:
                            anyOf:
                              - type: "null"
                              - type: string
                          episodes:
                            anyOf:
                              - type: "null"
                              - type: number
                          year:
                            anyOf:
                              - type: "null"
                              - type: number
                        required:
                          - malId
                          - title
                          - format
                          - episodes
                          - year
                        additionalProperties: false
                    description: Per MAL ID, the seasons from the first one to this entry as AniList knows them. The first season's title is the best text to search Trakt with, since Trakt names the whole show.
                required:
                  - sources
                  - entries
                  - errors
                  - proposals
                  - mappings
                  - traktTitles
                  - chains
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mappings/reject:
    post:
      operationId: postMappingsReject
      tags:
        - mappings
      description: '"Not this show": the pair is stored and never proposed again.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                traktId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                animeKey:
                  type: string
              required:
                - traktId
                - animeKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mappings/unlink:
    post:
      operationId: postMappingsUnlink
      tags:
        - mappings
      description: Removes a link (or restores a show link you removed). Local database only; the pair is remembered so an automatic match does not quietly bring it back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    seasonId:
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 9007199254740991
                  required:
                    - seasonId
                - type: object
                  properties:
                    mappingId:
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 9007199254740991
                    restore:
                      type: boolean
                  required:
                    - mappingId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/mark/confirm:
    post:
      operationId: postMarkConfirm
      tags:
        - mark
      description: Writes the confirmed steps, one source after another. Each source is read again first and only written when it still shows what the preview showed, so a retry after a lost answer cannot mark an episode twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowKey:
                  type: string
                  minLength: 1
                source:
                  type: string
                  enum:
                    - trakt
                    - simkl
                    - mal
                steps:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        enum:
                          - trakt
                          - simkl
                          - mal
                      expected:
                        type: string
                      status:
                        anyOf:
                          - type: string
                            enum:
                              - completed
                              - hold
                              - dropped
                          - type: "null"
                      rating:
                        anyOf:
                          - type: integer
                            minimum: 1
                            maximum: 10
                          - type: "null"
                    required:
                      - source
                      - expected
                today:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
              required:
                - rowKey
                - steps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: array
                    items:
                      $ref: "#/components/schemas/MarkOutcome"
                required:
                  - outcomes
                additionalProperties: false
