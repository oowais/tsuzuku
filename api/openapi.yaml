                          type: array
                          items:
                            type: string
                          description: Posters for where you are in the show, most season-specific first. The page falls back to the next one when an image does not load.
                      required:
                        - upcoming
                        - reasons
                        - start
                        - key
                        - section
                        - kind
                        - title
                        - cells
                        - differs
                        - signature
                        - accepted
                        - agrees
                        - hasNext
                        - lastActivityAt
                        - images
                      additionalProperties: false
                  sources:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - error
                            - rate_limited
                            - ok
                            - auth_expired
                        stale:
                          type: boolean
                        fetchedAt:
                          anyOf:
                            - type: "null"
                            - type: string
                              format: date-time
                        retryAfter:
                          anyOf:
                            - type: "null"
                            - type: number
                        error:
                          type: string
                      required:
                        - status
                        - stale
                        - fetchedAt
                        - retryAfter
                      additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum:
                            - trakt
                            - simkl
                            - mal
                        error:
                          type: string
                      required:
                        - source
                        - error
                      additionalProperties: false
                  proposals:
                    type: number
                required:
                  - rows
                  - sources
                  - errors
                  - proposals
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/up-next/accept:
    post:
      operationId: postUpNextAccept
      tags:
        - up-next
      description: '"Accept this difference": stored with the positions you saw, so it comes back when any source moves.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowKey:
                  type: string
                  minLength: 1
                signature:
                  type: string
                  minLength: 1
              required:
                - rowKey
                - signature
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/up-next/undo-accept:
    post:
      operationId: postUpNextUndoAccept
      tags:
        - up-next
      description: Flag the difference again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowKey:
                  type: string
                  minLength: 1
              required:
                - rowKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/write-log:
    get:
      operationId: getWriteLog
      tags:
        - write-log
      description: The write log, newest first, with links to each source's item and episode, and the show's poster.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    at:
                      type: string
                      format: date-time
                    source:
                      type: string
                      enum:
                        - trakt
                        - simkl
                        - mal
                        - tmdb
                        - anilist
                    action:
                      type: string
                    rowKey:
                      type: string
                    markId:
                      anyOf:
                        - type: "null"
                        - type: string
                    title:
                      type: string
                    episode:
                      type: string
                    summary:
                      type: string
                    listStatus:
                      anyOf:
                        - type: "null"
                        - type: string
                    images:
                      type: array
                      items:
                        type: string
                    result:
                      type: string
                      enum:
                        - error
                        - ok
                    error:
                      anyOf:
                        - type: "null"
                        - type: string
                    url:
                      anyOf:
                        - type: "null"
                        - type: string
                    episodeUrl:
                      anyOf:
                        - type: "null"
                        - type: string
                  required:
                    - id
                    - at
                    - source
                    - action
                    - rowKey
                    - markId
                    - title
                    - episode
                    - summary
                    - listStatus
                    - images
                    - result
                    - error
                    - url
                    - episodeUrl
                  additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
    StartTarget:
      type: object
      properties:
        malId:
          type: number
        anilistId:
          anyOf:
            - type: "null"
            - type: number
        title:
          type: string
        format:
          anyOf:
            - type: "null"
            - type: string
        episodes:
          anyOf:
            - type: "null"
            - type: number
        status:
          anyOf:
            - type: "null"
            - type: string
        year:
          anyOf:
            - type: "null"
            - type: number
        cover:
          anyOf:
            - type: "null"
            - type: string
          description: AniList's cover, for the write log; null when AniList's answer has none (or was cached before it was asked).
      required:
        - malId
        - anilistId
        - title
        - format
        - episodes
        - status
        - year
        - cover
      additionalProperties: false
    StartPlan:
      type: object
      properties:
        rowKey:
          type: string
        title:
          type: string
        traktNext:
          type: string
          description: Trakt's next episode, e.g. S2E1.
        target:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/StartTarget"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/StartTarget"
          description: Several sequels to choose from, when AniList names more than one.
        placement:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/StartPlacement"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StartStep"
        skipped:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - simkl
                  - mal
              reason:
                type: string
            required:
              - source
              - reason
            additionalProperties: false
        needsSearch:
          type: boolean
          description: "Nothing links the show to an anime, or no sequel is known: pick one from a search."
      required:
        - rowKey
        - title
        - traktNext
        - target
        - choices
        - placement
        - steps
        - skipped
        - needsSearch
      additionalProperties: false
    StartPlacement:
      type: object
      properties:
        traktSeason:
          type: number
        episodeOffset:
          type: number
        linked:
          type: boolean
      required:
        - traktSeason
        - episodeOffset
        - linked
      additionalProperties: false
    StartStep:
      type: object
      properties:
        source:
          type: string
          enum:
            - simkl
            - mal
        summary:
          type: string
        expected:
          type: string
          description: What the source showed when planned; the confirm refuses the write if it has moved since.
      required:
        - source
        - summary
        - expected
      additionalProperties: false
    BackupFile:
      type: object
      properties:
        name:
          type: string
        size:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - name
        - size
        - createdAt
      additionalProperties: false
    CalendarItem:
      type: object
      properties:
        source:
          type: string
          enum:
            - trakt
            - simkl
            - anilist
        group:
          type: string
          description: "Groups one show's items across sources: the Up Next row key, or the source's own key off Up Next."
        title:
          type: string
        episode:
          type: string
        episodeTitle:
          anyOf:
            - type: "null"
            - type: string
        airsAt:
          type: string
          description: An instant (ISO), or for a date-only source the calendar date as the source wrote it (YYYY-MM-DD).
        dateOnly:
          type: boolean
        url:
          anyOf:
            - type: "null"
            - type: string
        watched:
          type: boolean
          description: "You have watched it on that source's side (Trakt: in your Trakt history; anime: within your MAL count, else Simkl's). Unknown counts as not watched."
        onUpNext:
          type: boolean
      required:
        - source
        - group
        - title
        - episode
        - episodeTitle
        - airsAt
        - dateOnly
        - url
        - watched
        - onUpNext
      additionalProperties: false
    ComingBackResult:
      type: object
      properties:
        sequels:
          type: array
          items:
            type: object
            properties:
              malId:
                type: number
              anilistId:
                type: number
              title:
                type: string
              format:
                type: string
              stage:
                type: string
                enum:
                  - announced
                  - scheduled
                  - airing
                  - released
              startDate:
                type: object
                properties:
                  year:
                    anyOf:
                      - type: "null"
                      - type: number
                  month:
                    anyOf:
                      - type: "null"
                      - type: number
                  day:
                    anyOf:
                      - type: "null"
                      - type: number
                required:
                  - year
                  - month
                  - day
                additionalProperties: false
                description: AniList's own start date, any part of it null (an announcement can be just a year or a month).
              nextEpisode:
                anyOf:
                  - type: "null"
                  - type: object
                    properties:
                      episode:
                        type: number
                      airingAt:
                        type: number
                    required:
                      - episode
                      - airingAt
                    additionalProperties: false
                description: The next episode to air (Unix seconds), while one is scheduled.
              from:
                type: object
                properties:
                  malId:
                    type: number
                  title:
                    type: string
                required:
                  - malId
                  - title
                additionalProperties: false
                description: "The completed entry this follows: the newest one on the way, so long shows land on their latest season."
              onPlanToWatch:
                type: boolean
                description: "Already queued on MAL: same situation as the rest (the season is not started), shown with a badge."
              cover:
                anyOf:
                  - type: "null"
                  - type: string
                description: AniList's poster (`coverImage.medium`), null when it has none.
              dismissed:
                type: boolean
            required:
              - malId
              - anilistId
              - title
              - format
              - stage
              - startDate
              - nextEpisode
              - from
              - onPlanToWatch
              - cover
              - dismissed
            additionalProperties: false
          description: Every sequel found; the ones you dismissed carry the flag, so the page can offer to undo it.
        mal:
          type: object
          properties:
            status:
              type: string
              enum:
                - error
                - rate_limited
                - ok
                - auth_expired
            stale:
              type: boolean
            error:
              type: string
            retryAfter:
              anyOf:
                - type: "null"
                - type: number
            fetchedAt:
              anyOf:
                - type: "null"
                - type: string
          required:
            - status
            - stale
            - retryAfter
            - fetchedAt
          additionalProperties: false
          description: How each source answered, so the page can say a part is out of date instead of showing less silently.
        anilist:
          type: object
          properties:
            status:
              type: string
              enum:
                - error
                - rate_limited
                - ok
                - auth_expired
            missing:
              type: number
            error:
              type: string
          required:
            - status
            - missing
          additionalProperties: false
      required:
        - sequels
        - mal
        - anilist
      additionalProperties: false
    Entry:
      type: object
      properties:
        source:
          type: string
          enum:
            - trakt
            - simkl
            - mal
        key:
          type: string
          description: "`${source}:${id}`, unique across sources."
        kind:
          type: string
          enum:
            - anime
            - show
          description: The list the item came from. Trakt has no anime flag, so every Trakt entry is a show.
        format:
          anyOf:
            - type: "null"
            - type: string
          description: "Source's own type: Simkl `anime_type`, MAL `media_type` (tv, ona, ova, movie, special, ...). Null when not given."
        title:
          type: string
        altTitles:
          type: array
          items:
            type: string
        year:
          anyOf:
            - type: "null"
            - type: number
        ids:
          $ref: "#/components/schemas/EntryIds"
        watched:
          type: number
        episodes:
          anyOf:
            - type: "null"
            - type: number
          description: "Episode count as the source reports it: Trakt aired, Simkl aired (total minus not aired), MAL planned total. Null when unknown."
        notAired:
          type: number
          description: "Simkl only: episodes it knows of that have not aired yet (`not_aired_episodes_count`), so catching up on an airing season is not taken for its end."
        next:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/NextEpisode"
        lastActivityAt:
          anyOf:
            - type: "null"
            - type: string
          description: When the user last watched (Trakt, Simkl) or last updated the list entry (MAL).
        airing:
          anyOf:
            - type: "null"
            - type: string
          description: The source's own airing status, in its own words (Trakt show `status`, MAL `status`). Null for Simkl.
        image:
          anyOf:
            - type: "null"
            - type: string
          description: "The source's own poster: Trakt per show, Simkl and MAL per entry (one season or cour for anime)."
        rating:
          anyOf:
            - type: "null"
            - type: number
          description: Your own score for the entry, in the source's scale (1-10 on all three; MAL's 0 means none). Null when unrated or not part of the list answer (Trakt's up next carries none).
      required:
        - source
        - key
        - kind
        - format
        - title
        - altTitles
        - year
        - ids
        - watched
        - episodes
        - next
        - lastActivityAt
        - airing
        - image
      additionalProperties: false
    EntryIds:
      type: object
      properties:
        trakt:
          type: number
        traktSlug:
          type: string
        simkl:
          type: number
        simklSlug:
          type: string
          description: For links only; never used to match entries.
        mal:
          type: number
        anilist:
          type: number
        tmdb:
          type: number
        tvdb:
          type: number
        imdb:
          type: string
      additionalProperties: false
    NextEpisode:
      type: object
      properties:
        season:
          anyOf:
            - type: "null"
            - type: number
          description: Null when the source numbers episodes without seasons (Simkl anime, MAL).
        number:
          type: number
        title:
          anyOf:
            - type: "null"
            - type: string
        airedAt:
          anyOf:
            - type: "null"
            - type: string
          description: When it airs or aired, as the source gives it (Trakt `first_aired`, Simkl `next_to_watch_info.date`).
        type:
          anyOf:
            - type: "null"
            - type: string
          description: "Trakt only: `episode_type` (standard, season_premiere, mid_season_premiere, season_finale, ...; seen 2026-10-10 in up_next)."
      required:
        - season
        - number
        - title
      additionalProperties: false
    LinkGroup:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        via:
          type: array
          items:
            type: string
            enum:
              - trakt
              - simkl
              - mal
              - tmdb
              - anilist
              - imdb
              - traktSlug
              - tvdb
          description: The ID fields that joined the group.
        conflict:
          type: string
          description: Set when the group would hold two entries from the same source, for example two Simkl season entries that both carry the franchise's TMDB ID. Such a group is never linked automatically.
      required:
        - keys
        - via
      additionalProperties: false
    AniListLookup:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
            - rate_limited
            - ok
            - auth_expired
        media:
          type: object
          additionalProperties:
            anyOf:
              - type: "null"
              - $ref: "#/components/schemas/AniListMedia"
          description: Keyed by MAL ID. Null means AniList has no anime with that MAL ID.
        missing:
          type: array
          items:
            type: number
          description: MAL IDs that could not be looked up this time (source blocked or failing).
        retryAfter:
          anyOf:
            - type: "null"
            - type: number
        error:
          type: string
      required:
        - status
        - media
        - missing
        - retryAfter
      additionalProperties: false
    AniListMedia:
      type: object
      properties:
        id:
          type: number
        idMal:
          anyOf:
            - type: "null"
            - type: number
      required:
        - id
        - idMal
      additionalProperties: {}
    Proposal:
      type: object
      properties:
        animeKey:
          type: string
          description: The anime entry to place, by its key on your lists (MAL entry when there is one, else Simkl).
        trakt:
          $ref: "#/components/schemas/TraktRef"
        via:
          type: string
          enum:
            - ids
            - title
          description: How the Trakt show was found.
        score:
          type: number
        placement:
          $ref: "#/components/schemas/Placement"
        chain:
          type: array
          items:
            type: object
            properties:
              malId:
                type: number
              title:
                type: string
              format:
                anyOf:
                  - type: "null"
                  - type: string
              episodes:
                anyOf:
                  - type: "null"
                  - type: number
            required:
              - malId
              - title
              - format
              - episodes
            additionalProperties: false
          description: First season to this entry, as AniList knows it.
      required:
        - animeKey
        - trakt
        - via
        - score
        - placement
        - chain
      additionalProperties: false
    TraktRef:
      type: object
      properties:
        trakt:
          type: number
        slug:
          anyOf:
            - type: "null"
            - type: string
        tmdb:
          anyOf:
            - type: "null"
            - type: number
        title:
          type: string
        year:
          anyOf:
            - type: "null"
            - type: number
        next:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/NextEpisode"
          description: Trakt's next episode for you; only known for shows on your up-next list.
        onList:
          type: boolean
      required:
        - trakt
        - slug
        - tmdb
        - title
        - year
        - next
        - onList
      additionalProperties: false
    Placement:
      type: object
      properties:
        traktSeason:
          anyOf:
            - type: "null"
            - type: number
        episodeOffset:
          type: number
        fromProgress:
          type: boolean
          description: True when a source's progress lines up exactly with a plausible offset; false means check it.
      required:
        - traktSeason
        - episodeOffset
        - fromProgress
      additionalProperties: false
    MarkOutcome:
      type: object
      properties:
        source:
          type: string
          enum:
            - trakt
            - simkl
            - mal
        ok:
          type: boolean
        error:
          type: string
        retryAfter:
          anyOf:
            - type: "null"
            - type: number
        listStatus:
          anyOf:
            - type: "null"
            - type: string
          description: Where the source says the item is now (Simkl, MAL), e.g. completed.
        ratingError:
          type: string
          description: "Trakt and Simkl take the score in a call of their own, after the mark: it can fail while the mark stood."
      required:
        - source
        - ok
      additionalProperties: false
    MarkStep:
      type: object
      properties:
        source:
          type: string
          enum:
            - trakt
            - simkl
            - mal
        title:
          type: string
          description: The source's own title and the episode in its own numbering.
        episode:
          type: string
        summary:
          type: string
          description: For the write log, and a shorter form for the preview.
        note:
          type: string
        expected:
          type: string
          description: "What the source showed when this was planned: the confirm refuses the write if it has moved since."
        write:
          anyOf:
            - type: object
              properties:
                source:
                  const: trakt
                show:
                  type: number
                season:
                  type: number
                number:
                  type: number
                rating:
                  type: number
              required:
                - source
                - show
                - season
                - number
              additionalProperties: false
            - type: object
              properties:
                source:
                  const: simkl
                kind:
                  type: string
                  enum:
                    - anime
                    - show
                simkl:
                  type: number
                season:
                  anyOf:
                    - type: "null"
                    - type: number
                number:
                  type: number
                status:
                  anyOf:
                    - type: string
                      enum:
                        - hold
                        - dropped
                    - type: "null"
                rating:
                  type: number
              required:
                - source
                - kind
                - simkl
                - season
                - number
                - status
              additionalProperties: false
            - type: object
              properties:
                source:
                  const: mal
                mal:
                  type: number
                watched:
                  type: number
                status:
                  anyOf:
                    - type: string
                      enum:
                        - completed
                        - hold
                        - dropped
                    - type: "null"
                rating:
                  type: number
              required:
                - source
                - mal
                - watched
                - status
              additionalProperties: false
        link:
          type: object
          properties:
            target:
              $ref: "#/components/schemas/LinkTarget"
            episode:
              $ref: "#/components/schemas/EpisodeRef"
          required:
            - target
            - episode
          additionalProperties: false
          description: The source's item and episode, so the write log links to them without asking the source again.
        airsAt:
          anyOf:
            - type: "null"
            - type: object
              properties:
                date:
                  type: string
                by:
                  type: string
                  enum:
                    - trakt
                    - simkl
                    - mal
              required:
                - date
                - by
              additionalProperties: false
          description: Set when a source on the row dates this episode in the future. Marking it stays possible (a source's database can lag behind the real airing); the preview warns instead (#43).
        after:
          anyOf:
            - type: "null"
            - type: object
              properties:
                options:
                  type: array
                  items:
                    type: string
                    enum:
                      - completed
                      - hold
                      - dropped
                suggested:
                  anyOf:
                    - type: string
                      enum:
                        - completed
                        - hold
                        - dropped
                    - type: "null"
              required:
                - options
                - suggested
              additionalProperties: false
          description: "The statuses offered with the last episode the source has, and the one picked unless you change it (null: leave it to the source). Null when the episode is not the last one or the source has no status."
        rating:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/RatingOffer"
          description: Set on the last episode the source has; null otherwise.
      required:
        - source
        - title
        - episode
        - summary
        - note
        - expected
        - write
        - link
        - airsAt
        - after
        - rating
      additionalProperties: false
    LinkTarget:
      type: object
      properties:
        source:
          type: string
          enum:
            - trakt
            - simkl
            - mal
        kind:
          type: string
          enum:
            - movie
            - anime
            - show
        ids:
          type: object
          properties:
            traktSlug:
              type: string
            simkl:
              type: number
            simklSlug:
              type: string
            mal:
              type: number
          additionalProperties: false
      required:
        - source
        - kind
        - ids
      additionalProperties: false
    EpisodeRef:
      type: object
      properties:
        season:
          anyOf:
            - type: "null"
            - type: number
        number:
          type: number
      required:
        - season
        - number
      additionalProperties: false
    RatingOffer:
      type: object
      properties:
        scope:
