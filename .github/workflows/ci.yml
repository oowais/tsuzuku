name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t tsuzuku .

      # Starts the image with an empty database: migrations run, the health check answers, and the
      # Up Next page renders with no source connected.
      - name: Start and check
        run: |
          docker run -d --name tsuzuku -p 127.0.0.1:3000:3000 \
            -e TOKEN_ENC_KEY="$(openssl rand -base64 32)" -e APP_URL=http://localhost:3000 \
            -e CF_ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com -e CF_ACCESS_AUD=ci tsuzuku
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              # Without a Cloudflare Access token, everything but the health check is refused.
              code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
              echo "GET / $code"
              [ "$code" = 403 ] && exit 0
              break
            fi
            sleep 1
          done
          docker logs tsuzuku
          exit 1
