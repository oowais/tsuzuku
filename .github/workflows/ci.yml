name: ci

# Checks and publishes the legacy Nuxt app (legacy/), and checks its answers against the API contract
# (api/openapi.yaml). A push that touches nothing there but Markdown runs nothing: no checks, no new image.
on:
  push:
    paths:
      - "legacy/**"
      - "!legacy/**.md"
      - "api/**"
      - "!api/**.md"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: legacy

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: ${{ matrix.node }}
          working-directory: legacy
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Format, lint and type check (oxfmt, oxlint, tsgolint).
      - name: Check
        run: vp check

      # Vue templates too; `vp check` does not read .vue files' types.
      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp test run

      # The API contract (#108): a demo server (fictional shows, fake sources, nothing reaches a real source)
      # answers every endpoint, writes included, and each answer must validate against api/openapi.yaml.
      - name: API contract
        run: |
          TOKEN_ENC_KEY="$(openssl rand -base64 32)" vp run dev:demo > dev.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://localhost:3000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          vp run check:api --writes || { cat dev.log; exit 1; }

  # Builds and checks the image on every push; on main, after the checks above pass, publishes it to GHCR
  # as ghcr.io/oowais/tsuzuku:latest and :<short commit>. The package is private; the server pulls it.
  docker:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build -f legacy/Dockerfile -t tsuzuku \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} .

      # Starts the image with an empty database: migrations run, the health check answers, and the
      # Up Next page renders with no source connected.
      - name: Start and check
        run: |
          docker run -d --name tsuzuku -p 127.0.0.1:3000:3000 \
            -e TOKEN_ENC_KEY="$(openssl rand -base64 32)" -e APP_URL=http://localhost:3000 \
            -e CF_ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com -e CF_ACCESS_AUD=ci tsuzuku
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              # Without a Cloudflare Access token, everything but the health check is refused.
              code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
              echo "GET / $code"
              [ "$code" = 403 ] && exit 0
              break
            fi
            sleep 1
          done
          docker logs tsuzuku
          exit 1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          short=${GITHUB_SHA::7}
          docker tag tsuzuku "$IMAGE:latest"
          docker tag tsuzuku "$IMAGE:$short"
          docker push "$IMAGE:$short"
          docker push "$IMAGE:latest"

      # Free private packages get 500 MB; every push adds a version. The newest 10 are kept for rollback.
      - name: Prune old images
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: tsuzuku
          package-type: container
          min-versions-to-keep: 10
