name: app

# Checks the Flutter app (app/): generated API client up to date with api/openapi.yaml, format, analyze,
# tests (including the golden fixtures in api/fixtures/ replayed through the client). Release builds are
# a separate workflow (#108, step 3.2).
on:
  push:
    paths:
      - "app/**"
      - "!app/**.md"
      - "api/**"
      - "!api/**.md"
      - ".github/workflows/app.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # lib/api/ must be what tool/generate_api.dart makes from api/openapi.yaml.
      - name: API client up to date
        run: dart run tool/generate_api.dart --check

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
